<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Contatos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
        }
        /* Adiciona um cursor de ponteiro para os botões */
        .btn {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Agenda</a>
            <button class="btn btn-outline-light" onclick="logout()">Sair</button>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card mb-4">
            <h5 class="card-header">Adicionar Novo Contato</h5>
            <div class="card-body">
                <form id="form-adicionar">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome:</label>
                        <input type="text" class="form-control" id="nome" required>
                    </div>
                    <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone:</label>
                        <input type="tel" class="form-control" id="telefone" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </form>
            </div>
        </div>

        <div class="card">
            <h5 class="card-header">Meus Contatos</h5>
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-contatos">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Constantes e variáveis globais
        const API_URL = '/api/agenda/contatos';
        const formAdicionar = document.getElementById('form-adicionar');
        const listaContatos = document.getElementById('lista-contatos');
        
        // Pega o token de ID do sessionStorage (armazenamento da sessão do navegador)
        const idToken = sessionStorage.getItem('idToken');

        // Se não houver token, o usuário não está logado. Redireciona para a página de login.
        if (!idToken) {
            window.location.href = '/login.html';
        }

        // Cria o objeto de cabeçalhos que será usado em todas as requisições para a API
        const authHeaders = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${idToken}` // Formato "Bearer" é padrão
        };

        // Função para carregar e exibir os contatos da API
        async function carregarContatos() {
            try {
                const response = await fetch(API_URL, { headers: authHeaders });
                if (!response.ok) throw new Error('Erro ao buscar contatos');
                
                const contatos = await response.json();
                listaContatos.innerHTML = ''; // Limpa a lista atual para evitar duplicatas

                if (contatos.length === 0) {
                    listaContatos.innerHTML = '<tr><td colspan="3" class="text-center">Nenhum contato na agenda.</td></tr>';
                } else {
                    contatos.forEach(contato => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${contato.nome}</td>
                            <td>${contato.telefone}</td>
                            <td class="text-end">
                                <button class="btn btn-danger btn-sm" onclick="removerContato('${contato.id}')">Remover</button>
                            </td>
                        `;
                        listaContatos.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error('Falha ao carregar contatos:', error);
                listaContatos.innerHTML = '<tr><td colspan="3" class="text-center text-danger">Falha ao carregar contatos. Tente novamente mais tarde.</td></tr>';
            }
        }

        // Event listener para o formulário de adicionar contato
        formAdicionar.addEventListener('submit', async function(event) {
            event.preventDefault(); // Impede o recarregamento da página
            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: authHeaders,
                    body: JSON.stringify({ nome, telefone })
                });

                if (!response.ok) {
                    const errorMsg = await response.text();
                    throw new Error(errorMsg || 'Erro ao adicionar contato');
                }

                formAdicionar.reset(); // Limpa os campos do formulário
                carregarContatos(); // Recarrega a lista para mostrar o novo contato
                
            } catch (error) {
                console.error('Falha ao adicionar contato:', error);
                alert(error.message);
            }
        });

        // Função para remover um contato (será chamada pelo botão "Remover")
        async function removerContato(id) {
            if (!confirm('Tem certeza que deseja remover este contato?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`, { 
                    method: 'DELETE',
                    headers: authHeaders
                });
                
                if (!response.ok) throw new Error('Erro ao remover contato');
                
                carregarContatos(); // Recarrega a lista para refletir a remoção
            } catch (error) {
                console.error('Falha ao remover contato:', error);
                alert('Não foi possível remover o contato.');
            }
        }
        
        // Função de Logout
        function logout() {
            sessionStorage.removeItem('idToken'); // Remove o token
            window.location.href = '/login.html'; // Redireciona para o login
        }

        // Carrega os contatos assim que a página é totalmente carregada
        document.addEventListener('DOMContentLoaded', carregarContatos);
    </script>
</body>
</html>
