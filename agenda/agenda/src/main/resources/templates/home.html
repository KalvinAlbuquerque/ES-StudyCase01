<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Agenda</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light">Sair</button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Bem-vindo à sua Agenda de Contatos!</h1>
        <p>Esta é a página principal. Você está logado.</p>
        
        <h2 class="mt-5">Seus Contatos</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="contato : ${contatos}">
                    <td th:text="${contato.nome}">Nome do Contato</td>
                    <td th:text="${contato.telefone}">Telefone do Contato</td>
                </tr>
                <tr th:if="${#lists.isEmpty(contatos)}">
                    <td colspan="2">Nenhum contato na agenda.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
