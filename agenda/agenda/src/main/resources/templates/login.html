<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 500px;">
    <div class="card">
        <div class="card-header"><h3>Login Agenda</h3></div>
        <div class="card-body">
            <form id="login-form">
                <div id="error-message" class="alert alert-danger d-none">E-mail ou senha inválidos.</div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
        </div>
    </div>
</div>
<script>
    document.getElementById('login-form').addEventListener('submit', async function(event) {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');
        errorDiv.classList.add('d-none'); // Esconde o erro

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (!response.ok) throw new Error('Credenciais inválidas');
            
            const data = await response.json();
            // Salva o token no sessionStorage (dura enquanto a aba estiver aberta)
            sessionStorage.setItem('idToken', data.idToken);
            // Redireciona para a página da agenda
            window.location.href = '/agenda.html';

        } catch (error) {
            console.error(error);
            errorDiv.classList.remove('d-none'); // Mostra o erro
        }
    });
</script>
</body>
</html>
