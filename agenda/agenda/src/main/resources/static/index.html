<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Afrodite Calendar - Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display.swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav id="sidebar">
        <div class="sidebar-header">
            <img src="/logo1.png" alt="Logo" class="sidebar-logo">
            <h3>Afrodite Calendar</h3>
        </div>
        <ul class="list-unstyled components">
            <li class="active"><a href="/index.html">Meus Contatos</a></li>
            <li><a href="/adicionar.html">Adicionar Contato</a></li>
            <li><a href="/remover.html">Remover Contato</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="#" class="logout-button" onclick="logout()">Sair</a>
        </div>
    </nav>

    <div id="content">
        <div class="card">
            <h5 class="card-header">Meus Contatos</h5>
            <div class="card-body">
                <div class="mb-3">
                    <label for="search-input" class="form-label">Buscar Contato:</label>
                    <input type="text" class="form-control" id="search-input" placeholder="Digite o nome ou telefone...">
                </div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead><tr><th>Nome</th><th>Telefone</th></tr></thead>
                        <tbody id="lista-contatos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const listaContatos = document.getElementById('lista-contatos');
        const searchInput = document.getElementById('search-input');
        const idToken = sessionStorage.getItem('idToken');
        let allContacts = [];

        if (!idToken) window.location.href = '/login.html';

        function renderContacts(contactsToRender) {
            listaContatos.innerHTML = '';
            if (contactsToRender.length === 0) {
                const message = searchInput.value ? 'Nenhum contato encontrado para esta busca.' : 'Nenhum contato na agenda.';
                listaContatos.innerHTML = `<tr><td colspan="2" class="text-center">${message}</td></tr>`;
            } else {
                contactsToRender.forEach(contato => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td class="align-middle">${contato.nome}</td><td class="align-middle">${contato.telefone}</td>`;
                    listaContatos.appendChild(tr);
                });
            }
        }

        async function carregarContatos() {
            try {
                const response = await fetch('/api/agenda/contatos', { headers: { 'Authorization': `Bearer ${idToken}` } });
                if (!response.ok) throw new Error('Falha ao carregar contatos');
                allContacts = await response.json();
                renderContacts(allContacts);
            } catch (error) {
                console.error(error);
                listaContatos.innerHTML = `<tr><td colspan="2" class="text-center text-danger">Falha ao carregar contatos.</td></tr>`;
            }
        }

        searchInput.addEventListener('input', () => {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredContacts = allContacts.filter(contact => 
                contact.nome.toLowerCase().includes(searchTerm) ||
                contact.telefone.toLowerCase().includes(searchTerm)
            );
            renderContacts(filteredContacts);
        });

        document.addEventListener('DOMContentLoaded', carregarContatos);

        function logout() {
            sessionStorage.removeItem('idToken');
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
