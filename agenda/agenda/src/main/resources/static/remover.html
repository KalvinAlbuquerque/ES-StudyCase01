<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Afrodite Calendar - Remover</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display.swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav id="sidebar">
        <div class="sidebar-header">
            <img src="/logo1.png" alt="Logo" class="sidebar-logo">
            <h3>Afrodite Calendar</h3>
        </div>
        <ul class="list-unstyled components">
            <li><a href="/index.html">Meus Contatos</a></li>
            <li><a href="/adicionar.html">Adicionar Contato</a></li>
            <li class="active"><a href="/remover.html">Remover Contato</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="#" class="logout-button" onclick="logout()">Sair</a>
        </div>
    </nav>

    <div id="content">
        <div class="card mt-4">
            <h5 class="card-header">Remover Contato</h5>
            <div class="card-body">
                <div class="mb-3">
                    <label for="search-remove-input" class="form-label">Buscar Contato para Remover:</label>
                    <input type="text" class="form-control" id="search-remove-input" placeholder="Digite o nome ou telefone do contato...">
                </div>
                <div id="contact-to-remove" class="d-none">
                    <p><strong>Nome:</strong> <span id="contact-name"></span></p>
                    <p><strong>Telefone:</strong> <span id="contact-phone"></span></p>
                    <button id="remove-btn" class="btn btn-danger">Remover Contato</button>
                </div>
                 <p id="remove-feedback"></p>
            </div>
        </div>
    </div>

    <div class="toast-container"></div>
    <div class="modal fade" id="confirmRemoveModal" tabindex="-1" aria-labelledby="confirmRemoveModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmRemoveModalLabel">Confirmar Remoção</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Tem a certeza que deseja remover o contato <strong id="modalContactName"></strong>?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteButton">Sim, Remover</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const searchInput = document.getElementById('search-remove-input');
        const contactDiv = document.getElementById('contact-to-remove');
        const removeBtn = document.getElementById('remove-btn');
        const feedbackP = document.getElementById('remove-feedback');
        const idToken = sessionStorage.getItem('idToken');
        const toastContainer = document.querySelector('.toast-container');
        const confirmModalEl = document.getElementById('confirmRemoveModal');
        const confirmModal = new bootstrap.Modal(confirmModalEl);
        const modalContactName = document.getElementById('modalContactName');
        const confirmDeleteButton = document.getElementById('confirmDeleteButton');
        let contactFound = null;

        if (!idToken) window.location.href = '/login.html';

        function showToast(message, type = 'success') {
            const toastEl = document.createElement('div');
            const toastId = 'toast-' + Date.now();
            const bgClass = type === 'success' ? 'bg-success' : 'bg-danger';
            toastEl.id = toastId;
            toastEl.classList.add('toast', bgClass, 'text-white', 'border-0');
            toastEl.setAttribute('role', 'alert');
            toastEl.setAttribute('aria-live', 'assertive');
            toastEl.setAttribute('aria-atomic', 'true');
            toastEl.innerHTML = `<div class="d-flex"><div class="toast-body">${message}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>`;
            toastContainer.appendChild(toastEl);
            const toast = new bootstrap.Toast(document.getElementById(toastId));
            toast.show();
            toastEl.addEventListener('hidden.bs.toast', () => { toastEl.remove(); });
        }

        searchInput.addEventListener('input', async () => {
            const searchTerm = searchInput.value.toLowerCase();
            contactDiv.classList.add('d-none');
            feedbackP.textContent = '';
            if (searchTerm.length === 0) {
                 contactFound = null;
                 return;
            }
            try {
                const response = await fetch('/api/agenda/contatos', { headers: { 'Authorization': `Bearer ${idToken}` } });
                const allContacts = await response.json();
                contactFound = allContacts.find(c => 
                    c.nome.toLowerCase().includes(searchTerm) ||
                    c.telefone.toLowerCase().includes(searchTerm)
                );
                if (contactFound) {
                    document.getElementById('contact-name').textContent = contactFound.nome;
                    document.getElementById('contact-phone').textContent = contactFound.telefone;
                    contactDiv.classList.remove('d-none');
                } else {
                    feedbackP.textContent = 'Nenhum contato encontrado com este nome ou telefone.';
                }
            } catch (error) {
                feedbackP.textContent = 'Erro ao buscar contatos.';
            }
        });

        removeBtn.addEventListener('click', () => {
            if (!contactFound) return;
            modalContactName.textContent = contactFound.nome;
            confirmModal.show();
        });

        confirmDeleteButton.addEventListener('click', async () => {
            if (!contactFound) return;
            try {
                const response = await fetch(`/api/agenda/contatos/${contactFound.telefone}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${idToken}` }
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message);
                showToast('Contato removido com sucesso!', 'success');
                searchInput.value = '';
                contactDiv.classList.add('d-none');
                feedbackP.textContent = '';
                contactFound = null;
            } catch (error) {
                showToast(`Erro ao remover: ${error.message}`, 'danger');
            } finally {
                confirmModal.hide();
            }
        });

        function logout() {
            sessionStorage.removeItem('idToken');
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
