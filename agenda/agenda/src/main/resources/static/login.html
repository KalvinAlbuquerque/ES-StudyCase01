<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Afrodite Calendar - Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow-color: #f957d4;
            --secondary-glow-color: #8a42f5;
            --dark-bg: #12121c;
            --card-bg: rgba(22, 22, 34, 0.6);
            --text-color: #e0e0e0;
            --border-color: rgba(249, 87, 212, 0.2);
            --input-bg: #1e1e2d;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 1% 1%, var(--secondary-glow-color), transparent 25%), radial-gradient(circle at 99% 99%, var(--primary-glow-color), transparent 25%);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
        }

        .logo-img {
            display: block;
            max-width: 180px; 
            margin: 0 auto 1.5rem auto; 
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
        }

        .form-control:focus {
            background-color: var(--input-bg);
            color: var(--text-color);
            border-color: var(--primary-glow-color);
            box-shadow: 0 0 15px rgba(249, 87, 212, 0.4);
        }

        .form-control::placeholder {
            color: #888;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--primary-glow-color), var(--secondary-glow-color));
            border: none;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover, .btn-primary:focus {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(249, 87, 212, 0.5);
        }

        #error-message {
            background-color: rgba(255, 82, 82, 0.2);
            color: #ff8a8a;
            border-color: rgba(255, 82, 82, 0.5);
            text-align: center;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="card-header border-0 bg-transparent text-center">
        <img src="/logo1.png" alt="Afrodite Calendar Logo" class="logo-img">
    </div>
    <div class="card-body">
        <form id="login-form">
            <div id="error-message" class="alert d-none">E-mail ou senha inválidos.</div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required placeholder="seu@email.com">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" required placeholder="*****************">
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async function(event) {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');
        errorDiv.classList.add('d-none');

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (!response.ok) throw new Error('Credenciais inválidas');
            
            const data = await response.json();
            sessionStorage.setItem('idToken', data.idToken);
            window.location.href = '/index.html';

        } catch (error) {
            console.error(error);
            errorDiv.classList.remove('d-none');
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
