<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Afrodite Calendar - Adicionar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display.swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav id="sidebar">
        <div class="sidebar-header">
            <img src="/logo1.png" alt="Logo" class="sidebar-logo">
            <h3>Afrodite Calendar</h3>
        </div>
        <ul class="list-unstyled components">
            <li><a href="/index.html">Meus Contatos</a></li>
            <li class="active"><a href="/adicionar.html">Adicionar Contato</a></li>
            <li><a href="/remover.html">Remover Contato</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="#" class="logout-button" onclick="logout()">Sair</a>
        </div>
    </nav>

    <div id="content">
        <div class="card mt-4">
            <h5 class="card-header">Adicionar Novo Contato</h5>
            <div class="card-body">
                <form id="form-adicionar">
                    <div class="mb-3"><label for="nome" class="form-label">Nome:</label><input type="text" class="form-control" id="nome" required></div>
                    <div class="mb-3"><label for="telefone" class="form-label">Telefone:</label><input type="tel" class="form-control" id="telefone" required></div>
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </form>
            </div>
        </div>
    </div>

    <div class="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const formAdicionar = document.getElementById('form-adicionar');
        const idToken = sessionStorage.getItem('idToken');
        const toastContainer = document.querySelector('.toast-container');

        if (!idToken) window.location.href = '/login.html';

        function showToast(message, type = 'success') {
            const toastEl = document.createElement('div');
            const toastId = 'toast-' + Date.now();
            const bgClass = type === 'success' ? 'bg-success' : 'bg-danger';
            toastEl.id = toastId;
            toastEl.classList.add('toast', bgClass, 'text-white', 'border-0');
            toastEl.setAttribute('role', 'alert');
            toastEl.setAttribute('aria-live', 'assertive');
            toastEl.setAttribute('aria-atomic', 'true');
            toastEl.innerHTML = `<div class="d-flex"><div class="toast-body">${message}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>`;
            toastContainer.appendChild(toastEl);
            const toast = new bootstrap.Toast(document.getElementById(toastId));
            toast.show();
            toastEl.addEventListener('hidden.bs.toast', () => { toastEl.remove(); });
        }

        formAdicionar.addEventListener('submit', async (event) => {
            event.preventDefault();
            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;
            try {
                const response = await fetch('/api/agenda/contatos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
                    body: JSON.stringify({ nome, telefone })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'Erro ao adicionar.');
                formAdicionar.reset();
                showToast('Contato adicionado com sucesso!', 'success');
            } catch (error) {
                showToast(error.message, 'danger');
            }
        });

        function logout() {
            sessionStorage.removeItem('idToken');
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
