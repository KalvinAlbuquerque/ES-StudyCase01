<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agenda de Contatos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Agenda</a>
            <button class="btn btn-outline-light" onclick="logout()">Sair</button>
        </div>
    </nav>
    <div class="container my-5" style="max-width: 800px;">
        <div id="alert-container" class="mb-3"></div>

        <div class="card mb-4">
            <h5 class="card-header">Adicionar Novo Contato</h5>
            <div class="card-body">
                <form id="form-adicionar">
                    <div class="mb-3"><label for="nome" class="form-label">Nome:</label><input type="text" class="form-control" id="nome" required></div>
                    <div class="mb-3"><label for="telefone" class="form-label">Telefone:</label><input type="tel" class="form-control" id="telefone" required></div>
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </form>
            </div>
        </div>
        <div class="card">
            <h5 class="card-header">Meus Contatos</h5>
            <div class="card-body">
                <table class="table table-hover">
                    <thead><tr><th>Nome</th><th>Telefone</th><th class="text-end">Ações</th></tr></thead>
                    <tbody id="lista-contatos">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api/agenda/contatos';
        const formAdicionar = document.getElementById('form-adicionar');
        const listaContatos = document.getElementById('lista-contatos');
        const alertContainer = document.getElementById('alert-container');
        const idToken = sessionStorage.getItem('idToken');

        if (!idToken) {
            window.location.href = '/login.html';
        }

        const authHeaders = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` };

        function showAlert(message, type = 'success') {
            const alertType = type === 'success' ? 'alert-success' : 'alert-danger';
            alertContainer.innerHTML = `<div class="alert ${alertType} alert-dismissible fade show" role="alert">${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
        }

        async function carregarContatos() {
            // Mostra uma mensagem de "a carregar"
            listaContatos.innerHTML = '<tr><td colspan="3" class="text-center">A carregar contactos...</td></tr>';
            
            try {
                const response = await fetch(API_URL, { headers: { 'Authorization': `Bearer ${idToken}` } });

                if (!response.ok) {
                    // Se a resposta do servidor for um erro (ex: 401 Unauthorized), lança um erro
                    throw new Error(`Erro na rede: ${response.statusText}`);
                }

                const contatos = await response.json();
                console.log("Contactos recebidos da API:", contatos); // Útil para depuração

                listaContatos.innerHTML = ''; // Limpa a lista
                if (contatos.length === 0) {
                    listaContatos.innerHTML = '<tr><td colspan="3" class="text-center">Nenhum contacto na agenda. Adicione um novo!</td></tr>';
                } else {
                    contatos.forEach(contato => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td>${contato.nome}</td><td>${contato.telefone}</td><td class="text-end"><button class="btn btn-danger btn-sm" onclick="removerContato('${contato.telefone}')">Remover</button></td>`;
                        listaContatos.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error('Falha ao carregar contactos:', error);
                // Mostra uma mensagem de erro clara na tabela
                listaContatos.innerHTML = `<tr><td colspan="3" class="text-center text-danger">Falha ao carregar contactos. Verifique a sua conexão ou tente mais tarde.</td></tr>`;
            }
        }

        formAdicionar.addEventListener('submit', async function(event) {
            event.preventDefault();
            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;
            try {
                const response = await fetch(API_URL, { method: 'POST', headers: authHeaders, body: JSON.stringify({ nome, telefone }) });
                const data = await response.json();
                if (!response.ok) { throw new Error(data.message || 'Erro desconhecido ao adicionar.'); }
                formAdicionar.reset();
                showAlert(data.message, 'success');
                carregarContatos();
            } catch (error) {
                showAlert(error.message, 'danger');
            }
        });

        async function removerContato(telefone) {
            if (!confirm('Tem a certeza?')) return;
            try {
                const response = await fetch(`${API_URL}/${telefone}`, { method: 'DELETE', headers: authHeaders });
                const data = await response.json();
                if (!response.ok) { throw new Error(data.message || 'Erro desconhecido ao remover.'); }
                showAlert(data.message, 'success');
                carregarContatos();
            } catch (error) {
                showAlert(error.message, 'danger');
            }
        }

        function logout() {
            sessionStorage.removeItem('idToken');
            window.location.href = '/login.html';
        }

        document.addEventListener('DOMContentLoaded', carregarContatos);
    </script>
</body>
</html>
